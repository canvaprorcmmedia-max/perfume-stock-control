<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfume Stock Manager</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="login" hidden>
  <form id="lf" class="card lbox">
    <div class="logo">◆ Perfume Stock Manager</div>
    <p class="hint">Masuk untuk mengelola persediaan parfum</p>
    <label>Email<input name="email" type="email" autocomplete="username" placeholder="nama@email.com" required autofocus></label>
    <label>Kata sandi<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">Masuk</button>
  </form>
</div>
<div id="app" hidden>
  <aside id="side"><div class="logo">◆ Perfume<br><small>Stock Manager</small></div><nav id="nav"></nav></aside>
  <div class="wrap">
    <header>
      <button class="ib" id="burger"></button>
      <h2 id="title"></h2>
      <input id="gs" class="gs" placeholder="Cari produk...">
      <button class="ib" id="bell"><span id="bn" class="bn" hidden></span></button>
      <button class="btn ghost" id="logout" type="button">Keluar</button>
      <button class="prof" id="prof"><span class="av">A</span><span id="uname"></span></button>
      <button class="btn ghost" id="logout" type="button">Keluar</button>
    </header>
    <main id="main"></main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
